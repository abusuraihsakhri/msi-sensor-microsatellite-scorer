name: Tests and static checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3" "uvicorn>=0.30,<1" "pytest>=8,<10"
          python -m pip check
      - name: Syntax check
        run: python -m compileall -q msi_scorer.py cli.py agents enrichment.py tests
      - name: Unit and security regression tests
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax checks
        run: |
          node --check web/scoring.js
          node --check web/app.js
      - name: Browser algorithm unit tests
        run: node --test tests/test_browser_scoring.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container build
        run: docker build -t msi-scorer-ci .
